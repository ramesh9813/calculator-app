<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e14; color: #e8ecf3;
    font-family: -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; padding: 12px 12px 18px; gap: 10px; }
  #history { flex: 0 1 auto; min-height: 44px; max-height: 120px; overflow-y: auto; text-align: right; opacity: .55; font-size: 14px; line-height: 1.6; padding: 4px 6px; }
  #history .hitem { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #history .hres { color: #7dd3a8; }
  #expr {
    flex: 0 1 auto; min-height: 64px; text-align: right; font-size: clamp(28px, 7vw, 42px);
    padding: 6px 8px; overflow-x: auto; white-space: nowrap; color: #e8ecf3;
    scrollbar-width: none;
  }
  #expr::-webkit-scrollbar { display: none; }
  #result {
    text-align: right; font-size: clamp(18px, 4.5vw, 24px); color: #7dd3a8;
    min-height: 32px; padding: 0 8px 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #result.error { color: #f2797a; }
  #grid { flex: 1 1 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    border: none; border-radius: 16px; font-size: clamp(20px, 5.4vw, 30px); font-weight: 600;
    background: #1a2130; color: #e8ecf3; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .05s ease, background .1s ease;
  }
  button:active { transform: scale(.94); background: #232c40; }
  button.op { background: #24314a; color: #8fb7ff; }
  button.op:active { background: #2d3c5c; }
  button.eq { background: #2e7d5b; color: #fff; }
  button.eq:active { background: #37946c; }
  button.fn { background: #161c28; color: #9fb3d8; font-size: clamp(16px, 4.2vw, 22px); }
  button.fn:active { background: #1e2637; }
  button.danger { background: #3a2230; color: #ff9aa0; }
  button.danger:active { background: #4a2a3b; }
  button.wide { grid-column: span 2; }
  .hidden { display: none; }
  #togglebar { display: flex; gap: 10px; }
  #togglebar button { flex: 1; padding: 10px; font-size: 15px; background: #161c28; color: #9fb3d8; }
  #togglebar button.on { background: #24314a; color: #8fb7ff; }
</style>
</head>
<body>
<div id="app">
  <div id="history"></div>
  <div id="expr"></div>
  <div id="result">= 0</div>
  <div id="togglebar"><button id="sciToggle">Scientific</button><button id="histToggle">History</button></div>
  <div id="grid">
    <button class="danger" data-k="C">C</button>
    <button class="fn" data-k="(">(</button>
    <button class="fn" data-k=")">)</button>
    <button class="op" data-k="⌫">⌫</button>

    <button class="fn sci hidden" data-k="sin(">sin</button>
    <button class="fn sci hidden" data-k="cos(">cos</button>
    <button class="fn sci hidden" data-k="tan(">tan</button>
    <button class="op sci hidden" data-k="^">xʸ</button>

    <button class="fn sci hidden" data-k="√(">√</button>
    <button class="fn sci hidden" data-k="²">x²</button>
    <button class="fn sci hidden" data-k="log(">log</button>
    <button class="fn sci hidden" data-k="ln(">ln</button>

    <button class="fn sci hidden" data-k="π">π</button>
    <button class="fn sci hidden" data-k="e">e</button>
    <button class="fn sci hidden" data-k="!">n!</button>
    <button class="fn sci hidden" data-k="%">%</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="÷">÷</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="×">×</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="−">−</button>

    <button class="fn" data-k="%">%</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</div>
<script>
"use strict";
/* ---------- Safe expression evaluator (tokenizer + shunting-yard, no eval) ---------- */
const OPS = {
  '+':  {p:1, a:'L', f:(a,b)=>a+b},
  '−':  {p:1, a:'L', f:(a,b)=>a-b},
  '×':  {p:2, a:'L', f:(a,b)=>a*b},
  '÷':  {p:2, a:'L', f:(a,b)=>{ if(b===0) throw new Error('Divide by zero'); return a/b; }},
  '^':  {p:3, a:'R', f:(a,b)=>Math.pow(a,b)},
  '%':  {p:2, a:'L', f:(a,b)=>a/100*b},   // percentage: 50%200 = 100
  '!':  {p:4, a:'L', postfix:true, f:(a)=>{ if(a<0||!Number.isInteger(a)||a>170) throw new Error('Invalid factorial'); let r=1; for(let i=2;i<=a;i++) r*=i; return r; }},
  '²':  {p:4, a:'L', postfix:true, f:(a)=>a*a},
  'u-': {p:5, a:'R', f:(a)=>-a},          // unary minus
};
const FUNCS = {
  'sin': Math.sin, 'cos': Math.cos, 'tan': Math.tan,
  '√': (x)=>{ if(x<0) throw new Error('Invalid input'); return Math.sqrt(x); },
  'log': (x)=>{ if(x<=0) throw new Error('Invalid input'); return Math.log10(x); },
  'ln':  (x)=>{ if(x<=0) throw new Error('Invalid input'); return Math.log(x); },
};
const CONSTS = { 'π': Math.PI, 'e': Math.E };

function tokenize(s) {
  // normalize ASCII operator aliases to the canonical symbols
  s = s.replace(/-/g, '−').replace(/\*/g, '×').replace(/\//g, '÷');
  const toks = []; let i = 0;
  const names = Object.keys(FUNCS);
  while (i < s.length) {
    const c = s[i];
    if (c === ' ' ) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      const num = s.slice(i, j);
      if ((num.match(/\./g)||[]).length > 1) throw new Error('Bad number');
      toks.push({t:'num', v:parseFloat(num)}); i = j; continue;
    }
    if (CONSTS[c] !== undefined) { toks.push({t:'num', v:CONSTS[c]}); i++; continue; }
    if (c === '(') { toks.push({t:'lp'}); i++; continue; }
    if (c === ')') { toks.push({t:'rp'}); i++; continue; }
    if (OPS[c] !== undefined) { toks.push({t:'op', v:c}); i++; continue; }
    let matched = false;
    for (const n of names) {
      if (s.startsWith(n, i)) { toks.push({t:'fn', v:n}); i += n.length; matched = true; break; }
    }
    if (matched) continue;
    throw new Error('Bad token');
  }
  return toks;
}

function evaluate(expr) {
  let toks = tokenize(expr);
  // handle unary minus
  const out = [];
  let prev = null;
  for (const tk of toks) {
    if (tk.t === 'op' && tk.v === '−' && (prev === null || prev.t === 'op' || prev.t === 'lp' || prev.t === 'fn')) {
      out.push({t:'op', v:'u-'});
    } else out.push(tk);
    prev = out[out.length-1];
  }
  toks = out;
  // shunting-yard
  const rpn = []; const stack = [];
  for (const tk of toks) {
    if (tk.t === 'num') rpn.push(tk);
    else if (tk.t === 'fn') stack.push(tk);
    else if (tk.t === 'op') {
      const o1 = OPS[tk.v];
      while (stack.length) {
        const top = stack[stack.length-1];
        if (top.t === 'op') {
          const o2 = OPS[top.v];
          if ((o1.a === 'L' && o1.p <= o2.p) || (o1.a === 'R' && o1.p < o2.p)) { rpn.push(stack.pop()); continue; }
        }
        break;
      }
      stack.push(tk);
    }
    else if (tk.t === 'lp') stack.push(tk);
    else if (tk.t === 'rp') {
      let found = false;
      while (stack.length) {
        const top = stack.pop();
        if (top.t === 'lp') { found = true; break; }
        rpn.push(top);
      }
      if (!found) throw new Error('Mismatched parentheses');
      if (stack.length && stack[stack.length-1].t === 'fn') rpn.push(stack.pop());
    }
  }
  while (stack.length) {
    const top = stack.pop();
    if (top.t === 'lp') throw new Error('Mismatched parentheses');
    rpn.push(top);
  }
  // eval RPN
  const st = [];
  for (const tk of rpn) {
    if (tk.t === 'num') st.push(tk.v);
    else if (tk.t === 'fn') {
      if (st.length < 1) throw new Error('Bad expression');
      const r = FUNCS[tk.v](st.pop());
      if (!isFinite(r)) throw new Error('Invalid result');
      st.push(r);
    }
    else if (tk.t === 'op') {
      const op = OPS[tk.v];
      if (op.postfix || tk.v === 'u-') {
        if (st.length < 1) throw new Error('Bad expression');
        const r = op.f(st.pop());
        if (!isFinite(r)) throw new Error('Invalid result');
        st.push(r);
      } else {
        if (st.length < 2) throw new Error('Bad expression');
        const b = st.pop(), a = st.pop();
        const r = op.f(a, b);
        if (!isFinite(r)) throw new Error('Invalid result');
        st.push(r);
      }
    }
  }
  if (st.length !== 1) throw new Error('Bad expression');
  return st[0];
}

function fmt(n) {
  if (!isFinite(n)) throw new Error('Invalid result');
  let s = Number(n.toPrecision(12)).toString();
  return s;
}

/* ---------- UI ---------- */
const exprEl = document.getElementById('expr');
const resEl  = document.getElementById('result');
const histEl = document.getElementById('history');
let expr = '';
let history = [];
let sciOn = false;
let justEvaluated = false;

function render() {
  exprEl.textContent = expr || '0';
  exprEl.scrollLeft = exprEl.scrollWidth;
  if (expr.trim() === '') { resEl.textContent = '= 0'; resEl.classList.remove('error'); return; }
  try {
    const v = evaluate(expr);
    resEl.textContent = '= ' + fmt(v);
    resEl.classList.remove('error');
  } catch (e) {
    resEl.textContent = e.message || 'Error';
    resEl.classList.remove('error');
    // only mark red for committed evaluation errors below
  }
}

function renderHistory(show) {
  histEl.style.display = show ? 'block' : 'none';
  histEl.innerHTML = history.slice(-8).map(h =>
    '<div class="hitem">' + escapeHtml(h.e) + ' <span class="hres">= ' + escapeHtml(h.r) + '</span></div>'
  ).join('');
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function press(k) {
  if (k === 'C') { expr = ''; justEvaluated = false; render(); return; }
  if (k === '⌫') { expr = expr.slice(0, -1); justEvaluated = false; render(); return; }
  if (k === '=') {
    if (!expr.trim()) return;
    try {
      const v = fmt(evaluate(expr));
      history.push({e: expr, r: v});
      renderHistory(histVisible);
      expr = v; justEvaluated = true;
      resEl.textContent = '= ' + v; resEl.classList.remove('error');
      exprEl.textContent = expr; exprEl.scrollLeft = exprEl.scrollWidth;
    } catch (e) {
      resEl.textContent = e.message || 'Error'; resEl.classList.add('error');
    }
    return;
  }
  // starting a fresh expression after evaluation: digit/const/func starts new, operator continues
  if (justEvaluated) {
    if (/^[0-9.πe(]/.test(k) || /^(sin|cos|tan|√|log|ln)/.test(k)) expr = '';
    justEvaluated = false;
  }
  // prevent two binary operators in a row (replace the last)
  const last = expr.slice(-1);
  const isBinOp = c => ['+','−','×','÷','^','%'].includes(c);
  if (isBinOp(k) && isBinOp(last)) expr = expr.slice(0, -1) + k;
  else expr += k;
  render();
}

document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  press(b.dataset.k);
});

const sciToggle = document.getElementById('sciToggle');
sciToggle.addEventListener('click', () => {
  sciOn = !sciOn;
  sciToggle.classList.toggle('on', sciOn);
  document.querySelectorAll('.sci').forEach(b => b.classList.toggle('hidden', !sciOn));
});

let histVisible = false;
const histToggle = document.getElementById('histToggle');
histToggle.addEventListener('click', () => {
  histVisible = !histVisible;
  histToggle.classList.toggle('on', histVisible);
  renderHistory(histVisible);
});
renderHistory(false);
render();
</script>
</body>
</html>
