plugins {
    id 'com.android.application' version '8.5.2' apply false
}

android {
    namespace 'com.muse.calc'
    compileSdk 34

    defaultConfig {
        applicationId "com.muse.calc"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
